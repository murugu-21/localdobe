# Serves the Astro build. Mirrors public/_headers, which Cloudflare and Netlify
# read natively but nginx does not.
#
# A map keeps every header in one place. nginx drops a server-level add_header
# as soon as a location declares its own, so per-location rules are avoided.
# An empty map value means nginx sends no Cache-Control at all for that path.

map $uri $localdobe_cache {
    ~^/(_astro|wasm|fonts)/              "public, max-age=31536000, immutable";
    ~^/(sw\.js|manifest\.webmanifest)$   "no-cache";
    default                              "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers, so the /page -> /page/ redirect keeps the
    # scheme, host and port of whatever proxy sits in front.
    absolute_redirect off;

    # nginx's default mime.types has no entry for the PWA manifest.
    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    # Pages are built one folder per route (/split-pdf/index.html).
    location / {
        try_files $uri $uri/ =404;
    }

    add_header Cache-Control $localdobe_cache;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/manifest+json;
    # .wasm is deliberately not gzipped: the files are already dense and the
    # browser streams-compiles them straight from the response.
}
